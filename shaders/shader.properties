# ==============================================================================
# YUNMENG SHADERS (云梦) | GUOFENG INK & XIANXIA MIST
# ==============================================================================

# --- Quality & Performance Presets (Decoupled from Style Selection!) ---
profile.LOW    = CLOUD_QUALITY=0 SHADOW_FILTER_QUALITY=0 FOAM_QUALITY=0 NIGHT_AURORA=3 shadowMapResolution=1024 shadowDistance=96.0 LIGHT_SHAFTS=1 WATER_REFLECTIONS=0 SUN_LENS_FLARE=0
profile.MEDIUM = CLOUD_QUALITY=1 SHADOW_FILTER_QUALITY=1 FOAM_QUALITY=1 NIGHT_AURORA=0 shadowMapResolution=2048 shadowDistance=128.0 LIGHT_SHAFTS=1 WATER_REFLECTIONS=1 SUN_LENS_FLARE=1
profile.HIGH   = CLOUD_QUALITY=2 SHADOW_FILTER_QUALITY=2 FOAM_QUALITY=2 NIGHT_AURORA=0 shadowMapResolution=2048 shadowDistance=160.0 LIGHT_SHAFTS=2 WATER_REFLECTIONS=2 SUN_LENS_FLARE=2
profile.ULTRA  = CLOUD_QUALITY=3 SHADOW_FILTER_QUALITY=2 FOAM_QUALITY=2 NIGHT_AURORA=0 shadowMapResolution=4096 shadowDistance=224.0 LIGHT_SHAFTS=2 WATER_REFLECTIONS=2 SUN_LENS_FLARE=2

# --- Settings: one home per option, two-column pages ---
screen = <profile> STYLE_SELECTION [SKY_ATMOSPHERE] [LIGHTING_SHADOWS] [WATER_SETTINGS] [WIND_FOLIAGE] [CAMERA_SETTINGS] LICENSE_INFO
screen.columns = 2
screen.SKY_ATMOSPHERE = CLOUD_TYPE CLOUD_QUALITY NIGHT_AURORA SUN_SIZE SUN_LENS_FLARE FOG_DENSITY BIOME_TINT_STRENGTH SEA_OF_CLOUDS_ALTITUDE SEA_OF_CLOUDS_THICKNESS
screen.LIGHTING_SHADOWS = shadowMapResolution shadowDistance SHADOW_FILTER_QUALITY LIGHT_SHAFTS ATMOSPHERIC_SHAFT_STRENGTH
screen.WATER_SETTINGS = WATER_REFLECTIONS WATER_WAVE_HEIGHT WATER_FOAM_INTENSITY FOAM_QUALITY CAUSTICS_STRENGTH
screen.WIND_FOLIAGE = WIND_SPEED WAVING_BAMBOO WAVING_LEAVES WAVING_GRASS WAVING_SUGARCANE
screen.CAMERA_SETTINGS = ANTI_ALIASING MOTION_BLUR MOTION_BLUR_STRENGTH <empty> INK_OUTLINES VIGNETTE_STRENGTH EXPOSURE SATURATION PAINTERLY_WASH_STRENGTH PAPER_GRAIN_STRENGTH UNDERWATER_DISTORTION_STRENGTH
screen.SKY_ATMOSPHERE.columns = 2
screen.LIGHTING_SHADOWS.columns = 2
screen.WATER_SETTINGS.columns = 2
screen.WIND_FOLIAGE.columns = 2
screen.CAMERA_SETTINGS.columns = 2

# --- Strength sliders; quality modes use discrete buttons ---
sliders = ATMOSPHERIC_SHAFT_STRENGTH MOTION_BLUR_STRENGTH FOG_DENSITY BIOME_TINT_STRENGTH SUN_SIZE SEA_OF_CLOUDS_ALTITUDE SEA_OF_CLOUDS_THICKNESS shadowDistance WATER_FOAM_INTENSITY WATER_WAVE_HEIGHT CAUSTICS_STRENGTH WIND_SPEED VIGNETTE_STRENGTH EXPOSURE SATURATION PAINTERLY_WASH_STRENGTH PAPER_GRAIN_STRENGTH UNDERWATER_DISTORTION_STRENGTH

# --- Custom Textures (Bound via both texture.noise and customTexture) ---
texture.noise              = textures/wuxia_clouds.png
customTexture.celestialTex = textures/wuxia_celestial.png
customTexture.guofengMoonTex = textures/guofeng_moon_phases.png
customTexture.xianxiaMoonTex = textures/xianxia_moon_phases.png
customTexture.foamTex = textures/wuxia_foam.png
customTexture.cloudTex     = textures/wuxia_clouds.png
customTexture.cloudVolumeTex = textures/cloud_volume.png

# --- Render Target Buffer Precision ---
colortex0Format = RGBA16F
colortex1Format = RGBA16F
colortex2Format = RGBA8
colortex3Format = RGBA16F

# --- G-Buffer Blending Control ---
blend.gbuffers_terrain.colortex1 = off
blend.gbuffers_terrain.colortex2 = off
blend.gbuffers_entities.colortex1 = off
blend.gbuffers_entities.colortex2 = off
blend.gbuffers_entities_translucent.colortex1 = off
blend.gbuffers_entities_translucent.colortex2 = off
blend.gbuffers_hand.colortex1 = off
blend.gbuffers_hand.colortex2 = off
blend.gbuffers_block.colortex1 = off
blend.gbuffers_block.colortex2 = off
blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex1 = off
blend.gbuffers_water.colortex2 = off
blend.gbuffers_weather = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# --- Disable Default Vanilla Clouds ---
clouds = off

# --- Shadow & Diagonal Sun/Moon Orbit Directives ---
sunPathRotation = -42.0
ambientOcclusionLevel = 0.75
separateAo = true
oldHandLight = false
entityShadows = true
blockEntityShadows = true
playerShadows = true
shadowTerrain = true
shadowTranslucent = true

# --- Optional Iris Features ---
iris.features.optional = CUSTOM_IMAGES FADE_VARIABLE

# --- Custom Smoothed Biome & Environment Uniforms ---
uniform.float.inBambooJungle  = smooth(60, if(in(biome, BIOME_BAMBOO_JUNGLE, BIOME_JUNGLE, BIOME_SPARSE_JUNGLE), 1.0, 0.0), 10.0, 10.0)
uniform.float.inMountainBiome = smooth(61, if(in(biome, BIOME_JAGGED_PEAKS, BIOME_FROZEN_PEAKS, BIOME_STONY_PEAKS, BIOME_MEADOW, BIOME_GROVE, BIOME_SNOWY_SLOPES, BIOME_WINDSWEPT_HILLS, BIOME_WINDSWEPT_GRAVELLY_HILLS, BIOME_WINDSWEPT_FOREST, BIOME_CHERRY_GROVE), 1.0, 0.0), 10.0, 10.0)
uniform.float.inCherryGrove   = smooth(62, if(in(biome, BIOME_CHERRY_GROVE), 1.0, 0.0), 10.0, 10.0)
uniform.float.rainFactor      = smooth(63, rainStrength, 4.0, 4.0)
uniform.float.eyeSkyFactor    = smooth(64, eyeBrightness.y / 240.0, 4.0, 4.0)

# Optional temporal history, motion blur, and presentation passes.
#if ANTI_ALIASING == 3 || MOTION_BLUR == 2 || LIGHT_SHAFTS > 0
program.composite3.enabled = true
#else
program.composite3.enabled = false
#endif
#if MOTION_BLUR > 0
program.composite4.enabled = true
#else
program.composite4.enabled = false
#endif
#if ANTI_ALIASING > 0
program.composite5.enabled = true
#else
program.composite5.enabled = false
#endif
# Translucent held objects fall back to gbuffers_hand; retain its hand tag.
blend.gbuffers_hand_water.colortex1 = off
blend.gbuffers_hand_water.colortex2 = off

# Motion data must follow the visible surface without alpha blending.
blend.gbuffers_block.colortex5 = off
blend.gbuffers_entities.colortex5 = off
blend.gbuffers_entities_translucent.colortex5 = off
blend.gbuffers_hand.colortex5 = off
blend.gbuffers_terrain.colortex5 = off
blend.gbuffers_textured.colortex5 = off
blend.gbuffers_textured_lit.colortex5 = off
blend.gbuffers_water.colortex5 = off
blend.gbuffers_hand_water.colortex5 = off

# Cloud integration uses half width/height; only its own buffer is written here.
size.buffer.colortex8=0.5 0.5
size.buffer.colortex9=0.5 0.5

# Shared world-aligned cloud extinction cache (active rectangle scales by quality).
size.buffer.colortex10=0.5 0.5
