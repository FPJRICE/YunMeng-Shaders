# ==============================================================================
# YUNMENG SHADERS (äº‘æ¢¦) | GUOFENG INK & XIANXIA MIST
# ==============================================================================

# --- Quality & Performance Presets (Decoupled from Style Selection!) ---
profile.LOW    = CLOUD_QUALITY=0 ATMOSPHERIC_SHAFT_QUALITY=0 SHADOW_FILTER_QUALITY=0 DYNAMIC_LIGHTING=1 NIGHT_AURORA=3 shadowMapResolution=1024 shadowDistance=96.0 LIGHT_SHAFTS=0 WATER_REFLECTIONS=0 SUN_LENS_FLARE=0 ANTI_ALIASING=0 MOTION_BLUR=0 END_PORTAL_LAYERS=2
profile.MEDIUM = CLOUD_QUALITY=1 ATMOSPHERIC_SHAFT_QUALITY=1 SHADOW_FILTER_QUALITY=1 DYNAMIC_LIGHTING=2 NIGHT_AURORA=0 shadowMapResolution=2048 shadowDistance=128.0 LIGHT_SHAFTS=1 WATER_REFLECTIONS=1 SUN_LENS_FLARE=1 ANTI_ALIASING=1 MOTION_BLUR=1 END_PORTAL_LAYERS=3
profile.HIGH   = CLOUD_QUALITY=2 ATMOSPHERIC_SHAFT_QUALITY=2 SHADOW_FILTER_QUALITY=2 DYNAMIC_LIGHTING=3 NIGHT_AURORA=0 shadowMapResolution=2048 shadowDistance=160.0 LIGHT_SHAFTS=2 WATER_REFLECTIONS=2 SUN_LENS_FLARE=2 ANTI_ALIASING=2 MOTION_BLUR=2 END_PORTAL_LAYERS=4
profile.ULTRA  = CLOUD_QUALITY=3 ATMOSPHERIC_SHAFT_QUALITY=3 SHADOW_FILTER_QUALITY=2 DYNAMIC_LIGHTING=3 NIGHT_AURORA=0 shadowMapResolution=4096 shadowDistance=224.0 LIGHT_SHAFTS=2 WATER_REFLECTIONS=2 SUN_LENS_FLARE=2 ANTI_ALIASING=3 MOTION_BLUR=2 END_PORTAL_LAYERS=4

# --- Settings: one home per option, two-column pages ---
screen = <profile> LICENSE_INFO STYLE_SELECTION SKY_STYLE [SKY_ATMOSPHERE] [LIGHTING_SHADOWS] [WATER_SETTINGS] [WIND_FOLIAGE] [CAMERA_SETTINGS] <empty>
screen.columns = 2
screen.SKY_ATMOSPHERE = [CLOUD_SETTINGS] NIGHT_AURORA END_PORTAL_LAYERS SUN_SIZE SUN_LENS_FLARE FOG_DENSITY BIOME_TINT_STRENGTH SEA_OF_CLOUDS_ALTITUDE SEA_OF_CLOUDS_THICKNESS <empty>
screen.CLOUD_SETTINGS = CLOUD_SHAPE CLOUD_TYPE CLOUD_QUALITY CLOUD_RENDER_DISTANCE CLOUD_COVERAGE CLOUD_RAIN_COVERAGE CLOUD_DENSITY CLOUD_HORIZON_CURVE CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_SCALE CLOUD_SPEED
screen.CLOUD_SETTINGS.columns = 2
screen.LIGHTING_SHADOWS = shadowMapResolution shadowDistance SHADOW_FILTER_QUALITY DYNAMIC_LIGHTING LIGHT_SHAFTS ATMOSPHERIC_SHAFT_QUALITY ATMOSPHERIC_SHAFT_STRENGTH
screen.WATER_SETTINGS = WATER_STYLE WATER_REFLECTIONS WATER_WAVE_HEIGHT WATER_TEXTURE FLOW_FOAM_STRENGTH CAUSTICS_STRENGTH
screen.WIND_FOLIAGE = WIND_SPEED WAVING_BAMBOO WAVING_LEAVES WAVING_GRASS WAVING_SUGARCANE
screen.CAMERA_SETTINGS = ANTI_ALIASING MOTION_BLUR MOTION_BLUR_STRENGTH <empty> INK_OUTLINES VIGNETTE_STRENGTH EXPOSURE SATURATION PAINTERLY_WASH_STRENGTH PAPER_GRAIN_STRENGTH UNDERWATER_DISTORTION_STRENGTH
screen.SKY_ATMOSPHERE.columns = 2
screen.LIGHTING_SHADOWS.columns = 2
screen.WATER_SETTINGS.columns = 2
screen.WIND_FOLIAGE.columns = 2
screen.CAMERA_SETTINGS.columns = 2

# --- Strength sliders; quality modes use discrete buttons ---
sliders = ATMOSPHERIC_SHAFT_STRENGTH MOTION_BLUR_STRENGTH FOG_DENSITY BIOME_TINT_STRENGTH SUN_SIZE SEA_OF_CLOUDS_ALTITUDE SEA_OF_CLOUDS_THICKNESS shadowDistance WATER_WAVE_HEIGHT FLOW_FOAM_STRENGTH CAUSTICS_STRENGTH WIND_SPEED VIGNETTE_STRENGTH EXPOSURE SATURATION PAINTERLY_WASH_STRENGTH PAPER_GRAIN_STRENGTH UNDERWATER_DISTORTION_STRENGTH CLOUD_COVERAGE CLOUD_RAIN_COVERAGE CLOUD_DENSITY CLOUD_HORIZON_CURVE CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_SCALE CLOUD_SPEED CLOUD_RENDER_DISTANCE

# --- Custom Textures (Bound via both texture.noise and customTexture) ---
texture.noise              = textures/cloud_map.png
customTexture.celestialTex = textures/sun_atlas.png
customTexture.guofengMoonTex = textures/guofeng_moon_phases.png
customTexture.xianxiaMoonTex = textures/xianxia_moon_phases.png
customTexture.cloudTex     = textures/cloud_map.png
customTexture.cloudVolumeTex = textures/cloud_volume.png
customTexture.portalInkTex = textures/portal_ink_veil.png
customTexture.portalCloudTex = textures/portal_celestial_clouds.png

# Buffer formats are declared in GLSL alongside their writers.

# --- G-Buffer Blending Control ---
blend.gbuffers_terrain.colortex1 = off
blend.gbuffers_terrain.colortex2 = off
blend.gbuffers_entities.colortex1 = off
blend.gbuffers_entities.colortex2 = off
blend.gbuffers_entities_translucent.colortex1 = off
blend.gbuffers_entities_translucent.colortex2 = off
blend.gbuffers_hand.colortex1 = off
blend.gbuffers_hand.colortex2 = off
blend.gbuffers_block.colortex1 = off
blend.gbuffers_block.colortex2 = off
blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex1 = off
blend.gbuffers_water.colortex2 = off
blend.gbuffers_weather = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# --- Disable Default Vanilla Clouds ---
clouds = off

# --- Shadow & Diagonal Sun/Moon Orbit Directives ---
sunPathRotation = -42.0
ambientOcclusionLevel = 1.00
separateAo = true
oldHandLight = false
entityShadows = true
blockEntityShadows = true
playerShadows = true
shadowTerrain = true
shadowTranslucent = true
shadow.culling = reversed

# --- Optional Iris Features ---
iris.features.optional = CUSTOM_IMAGES FADE_VARIABLE

# --- Custom Smoothed Biome & Environment Uniforms (Universal category + climate expressions) ---
uniform.float.inBambooJungle  = smooth(60, if(biome_category == CAT_JUNGLE || (temperature > 0.88 && rainfall > 0.78), 1.0, 0.0), 5.0, 5.0)
uniform.float.inMountainBiome = smooth(61, if(biome_category == CAT_EXTREME_HILLS || (temperature >= 0.16 && temperature < 0.36 && rainfall < 0.75), 1.0, 0.0), 5.0, 5.0)
uniform.float.inCherryGrove   = smooth(62, if(temperature > 0.44 && temperature < 0.56 && rainfall > 0.75, 1.0, 0.0), 5.0, 5.0)
uniform.float.inSnowyBiome    = smooth(65, if(biome_precipitation == PPT_SNOW || biome_category == CAT_ICY || temperature < 0.16, 1.0, 0.0), 5.0, 5.0)
uniform.float.inAridBiome     = smooth(66, if(biome_category == CAT_DESERT || biome_category == CAT_SAVANNA || biome_category == CAT_MESA || (temperature > 0.92 && rainfall < 0.15), 1.0, 0.0), 5.0, 5.0)
uniform.float.inSwampBiome    = smooth(67, if(biome_category == CAT_SWAMP || (temperature >= 0.75 && temperature <= 0.88 && rainfall > 0.82), 1.0, 0.0), 5.0, 5.0)
uniform.float.rainFactor      = smooth(63, rainStrength, 4.0, 4.0)
uniform.float.eyeSkyFactor    = smooth(64, eyeBrightness.y / 240.0, 4.0, 4.0)

# Ultra reuses one filtered scene for its temporal neighborhood. Buffer 4 is
# scratch here and is overwritten later by motion blur; no new storage.
#if ANTI_ALIASING == 3 && LIGHT_SHAFTS > 0
program.composite4.enabled = true
#else
program.composite4.enabled = false
#endif
# Optional temporal history, motion blur, and presentation passes.
#if ANTI_ALIASING == 3 || MOTION_BLUR == 2 || LIGHT_SHAFTS > 0
program.composite5.enabled = true
#else
program.composite5.enabled = false
#endif
#if MOTION_BLUR > 0
program.composite6.enabled = true
#else
program.composite6.enabled = false
#endif
#if ANTI_ALIASING > 0
program.composite7.enabled = true
#else
program.composite7.enabled = false
#endif
# Translucent held objects fall back to gbuffers_hand; retain its hand tag.
blend.gbuffers_hand_water.colortex1 = off
blend.gbuffers_hand_water.colortex2 = off

# Motion data must follow the visible surface without alpha blending.
blend.gbuffers_block.colortex5 = off
blend.gbuffers_entities.colortex5 = off
blend.gbuffers_entities_translucent.colortex5 = off
blend.gbuffers_hand.colortex5 = off
blend.gbuffers_terrain.colortex5 = off
blend.gbuffers_textured.colortex5 = off
blend.gbuffers_textured_lit.colortex5 = off
blend.gbuffers_water.colortex5 = off
blend.gbuffers_hand_water.colortex5 = off

# Cloud integration uses half width/height; only its own buffer is written here.
size.buffer.colortex8=0.5 0.5
size.buffer.colortex9=0.5 0.5

# Shared world-aligned cloud extinction cache (active rectangle scales by quality).
size.buffer.colortex10=0.5 0.5
# Adjacent transmission tiles share detail spacing and have no temporal history.
size.buffer.colortex11=0.5 0.5

# Opaque bank evidence must not blend with foreground entities/particles.
blend.gbuffers_terrain.colortex13 = off
blend.gbuffers_block.colortex13 = off
blend.gbuffers_entities.colortex13 = off
blend.gbuffers_entities_translucent.colortex13 = off
blend.gbuffers_hand.colortex13 = off
blend.gbuffers_textured.colortex13 = off
blend.gbuffers_textured_lit.colortex13 = off
blend.gbuffers_water.colortex13 = ONE ONE ONE ONE

